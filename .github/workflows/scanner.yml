name: Krypto Skaner 24/7

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skaner:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Instalacja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalacja bibliotek
        run: |
          python -m pip install --upgrade pip
          pip install requests ccxt pandas numpy google-api-python-client google-auth

      - name: Uruchomienie skanera krypto
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_TASKS_CREDENTIALS: ${{ secrets.GOOGLE_TASKS_CREDENTIALS }}
        run: |
          python main.py

      - name: Zapisanie pamięci cache w repozytorium
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cache_krypto.json
          git commit -m "Aktualizacja cache_krypto.json [skip ci]" || exit 0
          git pull --rebase -X ours origin main
          git push origin main
