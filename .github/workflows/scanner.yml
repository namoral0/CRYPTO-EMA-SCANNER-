env:
  ACTIONS_NODE20_DEPRECATION_WARNING: "false"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
