name: Krypto Skaner 24/7

on:
  schedule:
    # Skanowanie co 15 minut, 24/7
    - cron: '*/15 * * * *'
  workflow_dispatch: # Umożliwia także ręczne uruchomienie przyciskiem w GitHub Actions

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Uprawnienie do zapisywania zmian w cache.json

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalacja bibliotek
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas requests google-api-python-client google-auth yfinance

      - name: Uruchomienie skryptu
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_TASKS_CREDENTIALS: ${{ secrets.GOOGLE_TASKS_CREDENTIALS }}
        run: python main.py

      - name: Zapisanie stanu pamięci (cache.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cache.json
          git commit -m "Aktualizacja cache.json [skip ci]" || exit 0
          git push
          
