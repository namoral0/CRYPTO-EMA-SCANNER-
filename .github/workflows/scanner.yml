name: Krypto Skaner 24/7

on:
  schedule:
    # Uruchamia się 5 minut po każdych pełnych 4 godzinach (24 godziny na dobę, 7 dni w tygodniu)
    - cron: '5 */4 * * *'
  workflow_dispatch: # Pozwala ręcznie uruchomić skrypt w dowolnym momencie z poziomu GitHuba

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Konieczne, aby GitHub mógł zapisać zaktualizowany plik cache.json

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: |
          python -m pip install --upgrade pip
          # Wszystkie paczki wymienione explicite, by zapobiec błędom brakujących bibliotek
          pip install ccxt pandas requests google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Uruchomienie skryptu
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_TASKS_CREDENTIALS: ${{ secrets.GOOGLE_TASKS_CREDENTIALS }}
        run: python main.py

      - name: Zapisanie stanu pamięci (cache.json)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add cache.json
          # Commit i push tylko wtedy, gdy plik cache.json faktycznie się zmienił (znalazł nowy sygnał)
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-zapis stanu powiadomień krypto [skip ci]" && git push)
          
