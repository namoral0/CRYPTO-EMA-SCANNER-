name: Run Crypto Scanner

on:
  schedule:
    # Uruchamianie automatyczne co 15 minut
    - cron: '*/15 * * * *'
  workflow_dispatch: # Przycisk do ręcznego uruchamiania z panelu GitHub
  push:
    branches:
      - main

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Pozwala skryptowi zapisywać i commitować plik cache_krypto.json

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Pamięć podręczna pip – skraca czas instalacji pakietów do kilkunastu sekund

      - name: Instalacja wymaganych pakietów
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wykonanie skanera Krypto
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_TASKS_CREDENTIALS: ${{ secrets.GOOGLE_TASKS_CREDENTIALS }}
          GOOGLE_TASK_LIST_ID: ${{ secrets.GOOGLE_TASK_LIST_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python main.py

      - name: Zapisz plik cache do repozytorium
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: aktualizacja cache_krypto.json [skip ci]"
          file_pattern: "cache_krypto.json"
