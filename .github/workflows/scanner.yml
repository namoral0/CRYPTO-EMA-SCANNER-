name: Crypto Scanner Schedule

on:
  schedule:
    # Uruchamianie automatyczne co 15 minut (od 0 do 59 minuty)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Umożliwia ręczne uruchomienie skryptu przyciskiem w GitHubie

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalacja wymaganych pakietów
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          else 
            pip install ccxt pandas gspread requests google-api-python-client google-auth
          fi

      - name: Wykonanie skanera Krypto
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_TASKS_CREDENTIALS: ${{ secrets.GOOGLE_TASKS_CREDENTIALS }}
          GOOGLE_TASK_LIST_ID: ${{ secrets.GOOGLE_TASK_LIST_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          FIXED_RISK_GBP: "50.0"
        run: python main.py
