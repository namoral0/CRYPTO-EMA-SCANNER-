name: Krypto Skaner 24/7

on:
  schedule:
    # Wymuszony format minutowy dla GitHub Actions
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Przywrócenie pamięci (cache.json)
        uses: actions/cache/restore@v4
        id: restore-cache
        with:
          path: cache.json
          key: crypto-cache-${{ github.run_id }}
          restore-keys: |
            crypto-cache-

      - name: Instalacja bibliotek
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas requests google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 yfinance gspread

      - name: Uruchomienie skryptu
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_TASKS_CREDENTIALS: ${{ secrets.GOOGLE_TASKS_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python main.py

      - name: Zapisanie pamięci (cache.json)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: cache.json
          key: crypto-cache-${{ github.run_id }}
          
